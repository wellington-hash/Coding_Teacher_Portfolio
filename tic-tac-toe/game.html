<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tic-Tac-Toe Game</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background: #f4f4f9; color: #333; }
        h1 { color: #0056b3; }
        .board { display: grid; grid-template-columns: repeat(3, 100px); gap: 5px; justify-content: center; margin: 20px auto; }
        .cell { width: 100px; height: 100px; background: white; border: 2px solid #0056b3; font-size: 2.5em; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 5px; user-select: none; }
        .cell:hover { background: #f1f1f1; }
        #status { font-size: 1.2em; margin-bottom: 15px; font-weight: bold; }
        button { padding: 10px 20px; background: #0056b3; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1em; }
        button:hover { background: #004095; }
    </style>
</head>
<body>
    <h1>Tic-Tac-Toe</h1>
    <div id="status">Player X's turn</div>
    <div class="board" id="board">
        <div class="cell" onclick="makeMove(0)"></div>
        <div class="cell" onclick="makeMove(1)"></div>
        <div class="cell" onclick="makeMove(2)"></div>
        <div class="cell" onclick="makeMove(3)"></div>
        <div class="cell" onclick="makeMove(4)"></div>
        <div class="cell" onclick="makeMove(5)"></div>
        <div class="cell" onclick="makeMove(6)"></div>
        <div class="cell" onclick="makeMove(7)"></div>
        <div class="cell" onclick="makeMove(8)"></div>
    </div>
    <button onclick="resetGame()">Restart Game</button>

    <script>
        let board = ["", "", "", "", "", "", "", "", ""];
        let currentPlayer = "X";
        let isGameActive = true;
        const winningConditions = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8], // Rows
            [0, 3, 6], [1, 4, 7], [2, 5, 8], // Columns
            [0, 4, 8], [2, 4, 6]             // Diagonals
        ];

        function makeMove(index) {
            if (board[index] !== "" || !isGameActive) return;
            
            board[index] = currentPlayer;
            document.getElementsByClassName("cell")[index].innerText = currentPlayer;
            
            checkResult();
        }

        function checkResult() {
            let roundWon = false;
            for (let condition of winningConditions) {
                let a = board[condition[0]];
                let b = board[condition[1]];
                let c = board[condition[2]];
                if (a === "" || b === "" || c === "") continue;
                if (a === b && b === c) {
                    roundWon = true;
                    break;
                }
            }

            if (roundWon) {
                document.getElementById("status").innerText = `Player ${currentPlayer} Wins!`;
                isGameActive = false;
                return;
            }

            if (!board.includes("")) {
                document.getElementById("status").innerText = "It's a Draw!";
                isGameActive = false;
                return;
            }

            currentPlayer = currentPlayer === "X" ? "O" : "X";
            document.getElementById("status").innerText = `Player ${currentPlayer}'s turn`;
        }

        function resetGame() {
            board = ["", "", "", "", "", "", "", "", ""];
            currentPlayer = "X";
            isGameActive = true;
            document.getElementById("status").innerText = `Player ${currentPlayer}'s turn`;
            let cells = document.getElementsByClassName("cell");
            for (let cell of cells) {
                cell.innerText = "";
            }
        }
    </script>
</body>
</html>
