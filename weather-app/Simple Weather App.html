<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple Weather App</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 50px; background: #eef2f3; text-align: center; }
        .card { background: white; padding: 30px; border-radius: 10px; display: inline-block; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 300px; }
        input { padding: 10px; width: 70%; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 15px; background: #007BFF; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        #result { margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h2>API Weather Checker</h2>
        <input type="text" id="cityInput" placeholder="Enter city name...">
        <br>
        <button onclick="getWeather()">Check Weather</button>
        <div id="result"></div>
    </div>

    <script>
        async function getWeather() {
            const city = document.getElementById('cityInput').value;
            const resultDiv = document.getElementById('result');
            
            if (!city) {
                resultDiv.innerHTML = "Please enter a city name.";
                return;
            }

            // Using a public mock/geo API or direct fetch demonstration
            resultDiv.innerHTML = `Fetching data for ${city}...`;
            
            try {
                // Simulating an API call response for demonstration purposes
                setTimeout(() => {
                    resultDiv.innerHTML = `City: ${city}<br>Temperature: 24°C<br>Condition: Sunny & Clear`;
                }, 1000);
            } catch (error) {
                resultDiv.innerHTML = "Could not fetch weather data.";
            }
        }
    </script>
</body>
</html>
